name: Apply Phase 6 Directly

on:
  push:
    branches:
      - phase6-global-experience
    paths:
      - tools/apply_phase6_direct.py
      - .github/workflows/apply-phase6-direct.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6-global-experience
  cancel-in-progress: false

jobs:
  apply-phase6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 6 branch
        uses: actions/checkout@v4
        with:
          ref: phase6-global-experience
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Phase 6
        run: python tools/apply_phase6_direct.py

      - name: Validate JavaScript syntax
        run: node --check assets/js/global-experience-2026.js

      - name: Validate modified HTML references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'index.html', 'discovery.html', 'language-access.html',
              'murugan-timeline.html', 'platform-hub.html', 'sloka-library.html',
              'temples.html', 'thiruppugazh.html', 'murugan-song-library.html',
              'gallery.html', 'audio-library.html', 'explore.html',
              'ai-search.html', 'apps.html', 'about.html', 'help-centre.html',
              'privacy.html', 'sources.html'
          ]
          checked = 0
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              required = [
                  'osb-phase6',
                  'assets/css/global-experience-2026.css?v=20260726-4',
                  'assets/css/phase6-experience-2026.css?v=20260726-1',
                  'assets/js/global-experience-2026.js?v=20260726-4',
                  '</head>',
                  '</body>',
              ]
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f'{name}: missing {missing}')
              if len(re.findall(r'assets/css/phase6-experience-2026\.css', text)) != 1:
                  raise SystemExit(f'{name}: duplicate Phase 6 stylesheet')
              if len(re.findall(r'assets/js/global-experience-2026\.js', text)) != 1:
                  raise SystemExit(f'{name}: duplicate global experience script')
              checked += 1
          if checked < 12:
              raise SystemExit(f'Only {checked} Phase 6 pages were validated')
          print(f'Validated {checked} Phase 6 pages')
          PY

      - name: Validate repository diff
        run: git diff --check

      - name: Commit Phase 6 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/css/global-experience-2026.css \
            assets/css/phase6-experience-2026.css \
            assets/js/global-experience-2026.js \
            index.html discovery.html language-access.html murugan-timeline.html \
            platform-hub.html sloka-library.html temples.html thiruppugazh.html \
            murugan-song-library.html gallery.html audio-library.html explore.html \
            ai-search.html apps.html about.html help-centre.html privacy.html sources.html
          if git diff --cached --quiet; then
            echo 'No Phase 6 changes were required.'
            exit 0
          fi
          git commit -m 'feat: roll out global language AI and Vel Mayil experience'
          git push origin HEAD:phase6-global-experience
