name: Phase 11 Premium Rollout Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'tools/phase-11/**'
      - '.github/workflows/phase11-premium-gate.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'tools/phase-11/**'
      - '.github/workflows/phase11-premium-gate.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: phase11-premium-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile deterministic tooling
        run: |
          python -m py_compile \
            tools/phase-c-h/build_route_recovery.py \
            tools/phase-c-h/run_route_recovery.py \
            tools/phase-c-h/build_content_completeness.py \
            tools/phase-c-h/build_capability_matrix.py \
            tools/phase-c-h/build_public_site.py \
            tools/phase-11/validate_premium_rollout.py

      - name: Generate governed build inputs
        run: |
          python tools/phase-c-h/run_route_recovery.py
          python tools/phase-c-h/build_content_completeness.py
          python tools/phase-c-h/build_capability_matrix.py

      - name: Build deterministic public artifact
        run: python tools/phase-c-h/build_public_site.py

      - name: Validate premium JavaScript
        run: node --check assets/js/global-experience-2026.js

      - name: Run Phase 11 premium rollout gate
        run: python tools/phase-11/validate_premium_rollout.py

      - name: Validate clean patch formatting
        run: git diff --check

      - name: Upload Phase 11 evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase11-premium-rollout-evidence
          path: reports/phase-11-premium-rollout
          if-no-files-found: error
          retention-days: 30
