name: Phase 11 Regression Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase11-test-diagnostics.yml'
      - 'tests/**'
      - 'data/operations/**'
      - 'service-worker.js'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture regression diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/phase11-tests
          set +e
          node --test tests/js/*.test.mjs > artifacts/phase11-tests/javascript.txt 2>&1
          js=$?
          python -B -m unittest discover -s tests/operations_observability -p 'test_*.py' -v > artifacts/phase11-tests/operations.txt 2>&1
          operations=$?
          python -B -m unittest discover -s tests/visual_experience -p 'test_*.py' -v > artifacts/phase11-tests/visual.txt 2>&1
          visual=$?
          python -B -m unittest discover -s tests/deployment_conformance -p 'test_*.py' -v > artifacts/phase11-tests/deployment.txt 2>&1
          deployment=$?
          python - <<PY
          import json
          from pathlib import Path
          Path('artifacts/phase11-tests/exit-codes.json').write_text(json.dumps({
            'javascript': int('$js'),
            'operations': int('$operations'),
            'visual': int('$visual'),
            'deployment': int('$deployment')
          }, indent=2) + '\n', encoding='utf-8')
          PY
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: phase11-regression-diagnostics
          path: artifacts/phase11-tests
          if-no-files-found: error
          retention-days: 7
