name: Apply Phase 11 Contract Reconciliation

on:
  push:
    branches:
      - phase11-premium-production-gate
    paths:
      - '.github/apply_phase11_reconciliation.py'
      - '.github/workflows/apply-phase11-reconciliation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/apply_phase11_reconciliation.py'
      - '.github/workflows/apply-phase11-reconciliation.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RECONCILIATION_REVISION: '2'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11-premium-production-gate
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reconciliations
        run: python .github/apply_phase11_reconciliation.py
      - name: Validate reconciled contracts and tests
        continue-on-error: true
        run: |
          node --check service-worker.js
          node --check assets/js/global-experience-2026.js
          node --test tests/js/*.test.mjs
          python -B -m tools.deployment_conformance.validate --root .
          python -B -m unittest discover -s tests/deployment_conformance -p 'test_*.py' -v
          python -B -m tools.effective_route_consumers.validate --root .
          python -B -m tools.operations_observability.validate --root . --mode package --report artifacts/phase11-operations-report.json
          git diff --check
      - name: Commit reconciled files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            service-worker.js \
            data/deployment-conformance.json \
            data/operations/check-catalog.json \
            tests/js/effective-route-registry.test.mjs \
            .github/workflows/production-baseline.yml \
            .github/workflows/effective-route-consumers.yml
          git commit -m 'fix: reconcile premium rollout production contracts'
          git push origin HEAD:phase11-premium-production-gate
