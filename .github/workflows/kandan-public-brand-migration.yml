name: Kandan public-brand migration

on:
  push:
    branches: [migration/kandan-legacy-site]
    paths: [.github/workflows/kandan-public-brand-migration.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/kandan-legacy-site
      - name: Migrate public identity and production URLs
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'https://omsaravanabhava.org': 'https://kandan.omsaravanabhava.org',
            '<title>ஓம் சரவணபவ | Lord Murugan Devotional Knowledge Platform</title>': '<title>Kandan | Lord Murugan Devotional Knowledge Platform</title>',
            '<meta property="og:title" content="ஓம் சரவணபவ">': '<meta property="og:title" content="Kandan — Lord Murugan Devotional Knowledge Platform">',
            'aria-label="Om Saravana Bhava — home"': 'aria-label="Kandan — home"',
            '<strong>ஓம் சரவணபவ</strong>\n      <small>Om Saravana Bhava</small>': '<strong>கந்தன் · Kandan</strong>\n      <small>Lord Murugan Devotional Knowledge</small>',
            'aria-label="Welcome to Om Saravana Bhava"': 'aria-label="Welcome to Kandan"',
            '<h1 lang="ta">ஓம் சரவணபவ</h1>': '<h1 lang="ta">கந்தன் · Kandan</h1>',
          }
          for name in ['index.html', 'sitemap.xml', 'robots.txt']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
      - name: Verify migration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://kandan.omsaravanabhava.org/' index.html
          grep -Fq '<title>Kandan | Lord Murugan Devotional Knowledge Platform</title>' index.html
          grep -Fq 'கந்தன் · Kandan' index.html
          grep -Fq 'https://kandan.omsaravanabhava.org/' sitemap.xml
          if grep -Fq 'https://omsaravanabhava.org' sitemap.xml; then echo 'Old production URLs remain in sitemap'; exit 1; fi
      - name: Commit controlled migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sitemap.xml robots.txt
          git commit -m 'Complete Kandan homepage and SEO identity migration'
          git push origin HEAD:migration/kandan-legacy-site
