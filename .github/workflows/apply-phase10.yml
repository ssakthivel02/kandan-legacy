name: Apply Phase 10 Trust and Quality

on:
  push:
    branches:
      - phase10-trust-quality
    paths:
      - '.github/apply_phase10.py'
      - '.github/workflows/apply-phase10.yml'
      - 'assets/css/phase10-trust-quality-2026.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-trust-quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 10 safely
        run: python .github/apply_phase10.py
      - name: Validate Phase 10
        run: |
          node --check assets/js/global-experience-2026.js
          python - <<'PY'
          from pathlib import Path
          targets = [
              'site-directory.html','content-status.html','accessibility.html',
              'route-recovery.html','content-completeness.html','platform-roadmap.html',
              'help-centre.html','privacy.html','sources.html','about.html'
          ]
          checked = 0
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              assert text.count('assets/css/phase10-trust-quality-2026.css?v=20260727-1') == 1, name
              assert text.count('assets/css/global-experience-2026.css?v=20260726-4') == 1, name
              assert text.count('assets/js/global-experience-2026.js?v=20260726-4') == 1, name
              assert 'osb-phase10' in text, name
              checked += 1
          assert checked >= 7, checked
          print(f'Validated {checked} Phase 10 pages')
          PY
          git diff --check
      - name: Commit applied Phase 10
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-directory.html content-status.html accessibility.html route-recovery.html content-completeness.html platform-roadmap.html help-centre.html privacy.html sources.html about.html
          git commit -m 'feat: add premium trust accessibility and quality experience'
          git push origin HEAD:phase10-trust-quality
