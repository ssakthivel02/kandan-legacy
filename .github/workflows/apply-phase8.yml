name: Apply Phase 8 Personal Tools

on:
  push:
    branches:
      - phase8-personal-tools
    paths:
      - '.github/apply_phase8.py'
      - '.github/workflows/apply-phase8.yml'
      - 'assets/css/phase8-personal-tools-2026.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-personal-tools
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 8 safely
        run: python .github/apply_phase8.py
      - name: Validate Phase 8
        run: |
          node --check assets/js/global-experience-2026.js
          python - <<'PY'
          from pathlib import Path
          targets = [
              'reading-workspace.html','personal-library.html','reading-notes.html',
              'devotional-collections.html','devotional-practice-planner.html','personal-data.html'
          ]
          checked = 0
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              assert text.count('assets/css/phase8-personal-tools-2026.css?v=20260727-1') == 1, name
              assert text.count('assets/css/global-experience-2026.css?v=20260726-4') == 1, name
              assert text.count('assets/js/global-experience-2026.js?v=20260726-4') == 1, name
              assert 'osb-phase8' in text, name
              checked += 1
          assert checked >= 4, checked
          print(f'Validated {checked} Phase 8 pages')
          PY
          git diff --check
      - name: Commit applied Phase 8
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading-workspace.html personal-library.html reading-notes.html devotional-collections.html devotional-practice-planner.html personal-data.html
          git commit -m 'feat: add premium personal reading library and planning experience'
          git push origin HEAD:phase8-personal-tools
