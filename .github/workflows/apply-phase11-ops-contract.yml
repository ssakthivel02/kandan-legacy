name: Apply Phase 11 Operations Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/fix_phase11_ops_contract.py'
      - '.github/workflows/apply-phase11-ops-contract.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: phase11-operations-contract
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11-premium-production-gate
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile current operations contract
        run: python .github/fix_phase11_ops_contract.py
      - name: Validate operations, deployment and JavaScript
        run: |
          node --check service-worker.js
          node --test tests/js/*.test.mjs
          python -B -m tools.deployment_conformance.validate --root .
          python -B -m unittest discover -s tests/deployment_conformance -p 'test_*.py' -v
          mkdir -p artifacts
          python -B -m tools.operations_observability.validate --root . --mode package --report artifacts/phase11-operations-report.json
          git diff --check
      - name: Commit reconciled operations contract
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/check-catalog.json service-worker.js
          git commit -m 'fix: align operations checks with premium cache release'
          git pull --rebase origin phase11-premium-production-gate
          git push origin HEAD:phase11-premium-production-gate
