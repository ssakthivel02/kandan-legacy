name: Apply Phase 7 Sacred Places

on:
  push:
    branches:
      - phase7-sacred-places
    paths:
      - '.github/apply_phase7.py'
      - '.github/workflows/apply-phase7.yml'
      - 'assets/css/phase7-sacred-places-2026.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-sacred-places
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 7 safely
        run: python .github/apply_phase7.py
      - name: Validate JavaScript and HTML references
        run: |
          node --check assets/js/global-experience-2026.js
          python - <<'PY'
          from pathlib import Path
          targets = [
              'temple-encyclopedia.html','arupadai-veedu.html','temples.html',
              'temple-detail.html','festivals.html','festival-calendar.html',
              'murugan-map.html','pilgrimage-planner.html'
          ]
          checked = 0
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              assert text.count('assets/css/phase7-sacred-places-2026.css?v=20260727-1') == 1, name
              assert text.count('assets/css/global-experience-2026.css?v=20260726-4') == 1, name
              assert text.count('assets/js/global-experience-2026.js?v=20260726-4') == 1, name
              assert 'osb-phase7' in text, name
              checked += 1
          assert checked >= 5, checked
          print(f'Validated {checked} Phase 7 pages')
          PY
          git diff --check
      - name: Commit applied Phase 7
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temple-encyclopedia.html arupadai-veedu.html temples.html temple-detail.html festivals.html festival-calendar.html murugan-map.html pilgrimage-planner.html
          git commit -m 'feat: add premium sacred places festivals and pilgrimage experience'
          git push origin HEAD:phase7-sacred-places
