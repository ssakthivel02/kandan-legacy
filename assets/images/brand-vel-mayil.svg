<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Vel and peacock emblem</title>
<desc id="desc">A golden Vel spear combined with a blue-green peacock feather inside a circular devotional emblem.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2b2434"/><stop offset="1" stop-color="#09070d"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0ad"/><stop offset=".42" stop-color="#f2bd54"/><stop offset="1" stop-color="#b87416"/></linearGradient>
<linearGradient id="feather" x1=".1" y1=".1" x2=".9" y2=".9"><stop offset="0" stop-color="#42c6b7"/><stop offset=".5" stop-color="#187e9d"/><stop offset="1" stop-color="#14346e"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="80" cy="80" r="75" fill="url(#bg)" stroke="#f2bd54" stroke-width="3"/>
<circle cx="80" cy="80" r="66" fill="none" stroke="#f2bd54" stroke-opacity=".24"/>
<path d="M39 112C30 82 42 45 69 26c-8 29-2 55 18 79-17 17-31 22-48 7Z" fill="none" stroke="url(#feather)" stroke-width="8" stroke-linecap="round"/>
<path d="M47 103c9-22 19-42 35-60" fill="none" stroke="#6bd7c5" stroke-opacity=".7" stroke-width="2"/>
<ellipse cx="63" cy="63" rx="16" ry="22" transform="rotate(-27 63 63)" fill="#14346e" stroke="#42c6b7" stroke-width="4"/>
<ellipse cx="63" cy="63" rx="8" ry="12" transform="rotate(-27 63 63)" fill="#f2bd54"/>
<ellipse cx="63" cy="63" rx="3.5" ry="6" transform="rotate(-27 63 63)" fill="#09070d"/>
<g filter="url(#glow)">
<path d="M102 18c-2 12-9 23-19 32l13 9-9 10 9 10-9 10 8 9-8 10 7 8-9 25h34l-9-25 7-8-8-10 8-9-9-10 9-10-9-10 13-9c-10-9-17-20-19-32Z" fill="url(#gold)" stroke="#fff3c2" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M102 40v82" stroke="#7a4709" stroke-width="3" stroke-linecap="round" opacity=".75"/>
